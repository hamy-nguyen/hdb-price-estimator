name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - "source/app/**"
      - ".github/workflows/deploy-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          # Upload api/ to HF Space root
          api.upload_folder(
              folder_path="source/app/api",
              repo_id="hamynguyen/hdb-price-estimator",
              repo_type="space",
              token=os.environ["HF_TOKEN"],
              allow_patterns=["*.py", "*.txt", "Dockerfile", "README.md"],
          )
          # Upload models/ to models/ path
          api.upload_folder(
              folder_path="source/app/models",
              path_in_repo="models",
              repo_id="hamynguyen/hdb-price-estimator",
              repo_type="space",
              token=os.environ["HF_TOKEN"],
              allow_patterns=["*.pkl"],
          )
          EOF
